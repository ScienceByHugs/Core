name: V2 staging foundation CI
on:
  push:
    branches: ['codex/v2-**']
  pull_request:
    branches: [main, 'codex/v2-**']
permissions:
  contents: read
concurrency:
  group: v2-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      VITE_APP_ENV: staging
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_EXPECTED_SUPABASE_REF: local
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_build_only
      VITE_APP_ORIGIN: http://localhost:5174
      VITE_PAYMENT_ENV: sandbox
      VITE_ENABLE_TEST_PAYMENTS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Generate PWA icons
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends librsvg2-bin
          rsvg-convert -w 192 -h 192 public/brand/core-app-icon.svg -o public/brand/core-icon-192.png
          rsvg-convert -w 512 -h 512 public/brand/core-app-icon.svg -o public/brand/core-icon-512.png
          rsvg-convert -w 180 -h 180 public/brand/core-app-icon.svg -o public/brand/core-apple-touch-icon.png
      - name: Run tests
        run: npm test
      - name: Build staging only
        run: npm run build
      - name: Verify staging artifact and workflow boundaries
        run: npm run verify:staging

  expo:
    name: Expo app (type check and iOS bundle)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: expo
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      # Compile-only values; the bundle is never run against a backend here.
      EXPO_PUBLIC_APP_ENV: staging
      EXPO_PUBLIC_SUPABASE_URL: https://cicompileonlyxxxxxxx.supabase.co
      EXPO_PUBLIC_EXPECTED_SUPABASE_REF: cicompileonlyxxxxxxx
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_build_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Same flags as Pulse: React Native's release candidate is outside some peer ranges.
      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Type check
        shell: bash
        run: |
          set -o pipefail
          # Report each error with its file and line so it shows on the PR.
          npx --no-install tsc --noEmit --pretty false \
            | sed -E 's#^([^(]+)\(([0-9]+),([0-9]+)\): error (TS[0-9]+): (.*)$#::error file=expo/\1,line=\2,col=\3::\4 \5#'
      - name: Compile the iOS bundle (no native build, no upload)
        run: npx --no-install expo export --platform ios --output-dir dist-check
